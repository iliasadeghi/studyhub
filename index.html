<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="StudyHub — organize tasks, notes, and classes in one calm place." />
    <meta name="theme-color" content="#5B5BD6" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>StudyHub</title>
    <script>
      // Apply theme before paint to avoid a flash.
      (function () {
        try {
          var raw = localStorage.getItem('studyhub:settings');
          var s = raw ? JSON.parse(raw).state : null;
          var theme = s && s.theme ? s.theme : 'system';
          var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          if (s && s.accent) document.documentElement.dataset.accent = s.accent;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
